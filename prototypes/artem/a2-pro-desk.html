<style>
@font-face { font-family: 'IBM Plex Sans'; src: url(fonts/ibm-plex-sans-cyrillic-400-normal.woff2) format('woff2'); font-weight: 400; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: 'IBM Plex Sans'; src: url(fonts/ibm-plex-sans-latin-400-normal.woff2) format('woff2'); font-weight: 400; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD, U+20BD; }
@font-face { font-family: 'IBM Plex Sans'; src: url(fonts/ibm-plex-sans-cyrillic-500-normal.woff2) format('woff2'); font-weight: 500; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: 'IBM Plex Sans'; src: url(fonts/ibm-plex-sans-latin-500-normal.woff2) format('woff2'); font-weight: 500; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD, U+20BD; }
@font-face { font-family: 'IBM Plex Sans'; src: url(fonts/ibm-plex-sans-cyrillic-600-normal.woff2) format('woff2'); font-weight: 600; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: 'IBM Plex Sans'; src: url(fonts/ibm-plex-sans-latin-600-normal.woff2) format('woff2'); font-weight: 600; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD, U+20BD; }
@font-face { font-family: 'IBM Plex Mono'; src: url(fonts/ibm-plex-mono-cyrillic-400-normal.woff2) format('woff2'); font-weight: 400; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: 'IBM Plex Mono'; src: url(fonts/ibm-plex-mono-latin-400-normal.woff2) format('woff2'); font-weight: 400; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD, U+20BD; }
@font-face { font-family: 'IBM Plex Mono'; src: url(fonts/ibm-plex-mono-cyrillic-500-normal.woff2) format('woff2'); font-weight: 500; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: 'IBM Plex Mono'; src: url(fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2'); font-weight: 500; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD, U+20BD; }
:root {
  --bg: #fff; --panel: #f4f6f8; --panel-2: #eceff3; --ink: #1b1e23; --ink-2: #39404a; --ink-3: #576069; --line: #d3d9e0; --line-2: #e7ebef;
  --graphite: #1b1e23; --graphite-2: #2a2f36; --on-dark: #fff; --on-dark-2: #cfd5dc;
  --blue: #0b4fb3; --blue-h: #083e8f; --blue-50: #eaf1fc;
  --tc-focus: #0b4fb3; --tc-mark: #ffe08a;
  --hdr: 60px; --wrap: 1400px; --pad: clamp(16px, 3vw, 32px); --r: 6px;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding-inline: var(--pad); }
h1, h2, h3 { margin: 0; font-weight: 600; line-height: 1.2; letter-spacing: -.01em; }
p { margin: 0; }
.mono { font-family: var(--mono); font-feature-settings: 'zero' 1; }
.muted { color: var(--ink-3); }
.eyebrow { font: 500 13px/1.4 var(--mono); color: var(--ink-3); letter-spacing: .02em; }
.note { font-size: 13px; line-height: 1.45; color: var(--ink-3); }

/* ---------- шапка ---------- */
.hdr { position: sticky; top: 0; z-index: 40; background: var(--graphite); color: var(--on-dark); }
.hdr :focus-visible { outline-color: #fff; }
.hdr-in { display: flex; align-items: center; gap: 24px; height: var(--hdr); }
.logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 600; font-size: 17px; letter-spacing: -.01em; white-space: nowrap; }
.logo i { font: 500 13px/1 var(--mono); font-style: normal; padding: 4px 6px; border: 1px solid #6b747f; border-radius: 4px; color: var(--on-dark-2); }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.nav a { flex: none; display: inline-flex; align-items: center; height: 36px; padding: 0 12px; border-radius: var(--r); text-decoration: none; color: var(--on-dark-2); font-weight: 500; }
.nav a:hover { color: #fff; background: var(--graphite-2); }
.nav a[aria-current="page"] { color: #fff; box-shadow: inset 0 -2px 0 #fff; border-radius: 0; }
.hsearch { flex: 1; max-width: 420px; margin-left: auto; display: none; }
body[data-page="product"] .hsearch { display: block; }
.hsearch input { width: 100%; height: 38px; padding: 0 12px; border: 1px solid #59626d; border-radius: var(--r); background: var(--graphite-2); color: #fff; }
.hsearch input::placeholder { color: #b9c0c8; }
.cart-btn { margin-left: auto; display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px; border: 0; border-radius: var(--r); background: var(--blue); color: #fff; font-weight: 500; white-space: nowrap; }
body[data-page="product"] .cart-btn { margin-left: 0; }
.cart-btn:hover { background: var(--blue-h); }
.cart-btn b { font: 500 14px/1 var(--mono); padding: 4px 7px; border-radius: 4px; background: rgba(255,255,255,.16); }
.cart-btn .sum { font: 500 14px/1 var(--mono); }

/* ---------- раскладка ---------- */
.shell { display: block; }
.dock { display: none; }
@media (min-width: 1200px) {
  body[data-page="catalog"] .shell { display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
  body[data-page="catalog"] .dock { display: block; }
  body[data-page="catalog"] .shell { background: linear-gradient(to left, var(--panel) 359px, var(--line) 359px, var(--line) 360px, transparent 360px); }
}

/* ---------- кнопки, степперы ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--blue); border-radius: var(--r); background: var(--blue); color: #fff; font-weight: 500; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--blue-h); border-color: var(--blue-h); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: #fff; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ink); background: #fff; }
.btn[aria-disabled="true"] { background: var(--panel-2); border-color: var(--line); color: var(--ink-2); cursor: not-allowed; transform: none; }
.lnk { color: var(--blue); text-underline-offset: 3px; font-weight: 500; }
.lnk:hover { color: var(--blue-h); }
.step { display: inline-flex; align-items: stretch; height: 36px; border: 1px solid var(--line); border-radius: var(--r); background: #fff; }
.step button { width: 32px; border: 0; background: transparent; font-size: 17px; line-height: 1; color: var(--ink-2); }
.step button:hover { background: var(--panel); color: var(--ink); }
.step output { min-width: 30px; display: grid; place-items: center; font: 500 14px/1 var(--mono); border-inline: 1px solid var(--line-2); }
.add { height: 36px; padding: 0 12px; font-size: 14px; }

/* ---------- главная ---------- */
.hero { padding-block: clamp(28px, 5vw, 56px) 28px; border-bottom: 1px solid var(--line-2); }
.hero h1 { margin-top: 10px; font-size: clamp(30px, 4.2vw, 52px); letter-spacing: -.025em; max-width: 18ch; }
.hero-lead { margin-top: 12px; max-width: 62ch; font-size: 17px; color: var(--ink-2); }
.qo { margin-top: 28px; }
.qo label { display: block; font-weight: 600; margin-bottom: 8px; }
.qo-row { display: flex; gap: 8px; }
.qo-field { position: relative; flex: 1; min-width: 0; }
.qo-field svg { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
.qo input { width: 100%; height: 64px; padding: 0 18px 0 52px; border: 2px solid var(--ink); border-radius: 8px; background: #fff; font: 400 20px/1 var(--mono); }
.qo input::placeholder { color: #6a727c; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 18px; }
.qo .btn { height: 64px; padding: 0 26px; font-size: 16px; border-radius: 8px; }
.qo-hint { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 12px; font-size: 14px; color: var(--ink-3); }
.qo-hint a { font-family: var(--mono); color: var(--ink); text-underline-offset: 3px; }
.quick { margin-top: 18px; }
.quick-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; font-size: 14px; }

.how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--line-2); }
.how li { padding: 24px 24px 26px 0; list-style: none; }
.how li + li { padding-left: 24px; border-left: 1px solid var(--line-2); }
.how ol { display: contents; }
.how-n { font: 500 13px/1 var(--mono); color: var(--blue); }
.how h3 { margin: 10px 0 6px; font-size: 17px; }
.how p { color: var(--ink-2); font-size: 15px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 40px 0 12px; }
.sec-h h2 { font-size: 22px; }

.cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 40px; }
.dir { columns: 2; column-gap: 32px; }
.dir-g { break-inside: avoid; margin-bottom: 22px; }
.dir-root { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 2px solid var(--ink); text-decoration: none; font-weight: 600; font-size: 16px; }
.dir-root:hover span:first-child { color: var(--blue); text-decoration: underline; text-underline-offset: 3px; }
.dir ul, .brands { list-style: none; margin: 0; padding: 0; }
.dir li a, .brands li > * { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line-2); text-decoration: none; font-size: 15px; }
.dir li a:hover span:first-child, .brands a:hover span:first-child { color: var(--blue); text-decoration: underline; text-underline-offset: 3px; }
.cnt { font: 400 14px/1.5 var(--mono); color: var(--ink-3); white-space: nowrap; }
.dir-more { margin-top: 6px; font-size: 13px; color: var(--ink-3); }
.brands-head { display: grid; grid-template-columns: 1fr 72px 96px; gap: 8px; padding: 0 0 6px; font: 500 13px/1.3 var(--mono); color: var(--ink-3); border-bottom: 2px solid var(--ink); }
.brands li > * { display: grid; grid-template-columns: 1fr 72px 96px; gap: 8px; }
.brands .cnt { text-align: right; }
.brands .is-off { color: var(--ink-3); }
.pro { margin-top: 48px; background: var(--graphite); color: var(--on-dark); border-radius: 10px; padding: clamp(22px, 3vw, 36px); display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 32px; }
.pro h2 { font-size: 24px; }
.pro p { margin-top: 10px; color: var(--on-dark-2); max-width: 56ch; }
.pro :focus-visible { outline-color: #fff; }
.pro dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 10px 18px; align-content: start; }
.pro dt { font: 500 13px/1.6 var(--mono); color: var(--on-dark-2); }
.pro dd { margin: 0; font-weight: 500; }
.pro a { color: #fff; text-underline-offset: 3px; }
.pro .tag { display: inline-block; margin-top: 14px; padding: 6px 10px; border: 1px solid #6b747f; border-radius: 4px; font: 500 13px/1.4 var(--mono); color: var(--on-dark-2); }

/* ---------- каталог ---------- */
.cat { padding-block: 24px 56px; }
.cat-head { display: flex; justify-content: space-between; align-items: end; gap: 12px 24px; flex-wrap: wrap; }
.cat-head h1 { margin-top: 6px; font-size: clamp(26px, 3vw, 36px); letter-spacing: -.02em; }
.found { font: 400 14px/1.5 var(--mono); color: var(--ink-3); }
.fbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 18px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.f-q { position: relative; flex: 1 1 300px; min-width: 0; display: flex; }
.f-q input { flex: 1; min-width: 0; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-right: 0; border-radius: var(--r) 0 0 var(--r); background: #fff; font-family: var(--mono); font-size: 15px; }
.f-q input::placeholder { color: #6a727c; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
.f-q button { height: 40px; padding: 0 14px; border: 1px solid var(--ink); border-radius: 0 var(--r) var(--r) 0; background: var(--ink); color: #fff; font-weight: 500; }
.f-sel { position: relative; display: inline-flex; flex-direction: column; }
.f-sel span { position: absolute; left: 12px; top: 4px; font: 500 13px/1 var(--mono); color: var(--ink-3); pointer-events: none; }
.f-sel select { height: 40px; min-width: 150px; max-width: 260px; padding: 12px 30px 0 11px; border: 1px solid var(--line); border-radius: var(--r); background: #fff; font-size: 14px; font-weight: 500; line-height: 1; }
.f-kind { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); background: #fff; overflow: hidden; }
.f-kind a { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px; text-decoration: none; font-size: 14px; font-weight: 500; }
.f-kind a + a { border-left: 1px solid var(--line); }
.f-kind a:hover { background: var(--panel); }
.f-kind a[aria-pressed="true"] { background: var(--ink); color: #fff; }
.f-kind a[aria-pressed="true"] .cnt { color: #dfe3e8; }
.f-sort { display: none; }
.f-reset { margin-left: auto; font-size: 14px; }
.notes { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 14px 0 8px; }

/* таблица-прайс */
.pt { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 15px; }
.pt th { position: sticky; top: var(--hdr); z-index: 2; background: var(--panel); text-align: left; font: 500 13px/1.3 var(--mono); color: var(--ink-2); padding: 0 10px; height: 40px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); white-space: nowrap; }
.pt th:first-child { border-left: 1px solid var(--line); border-radius: 6px 0 0 0; }
.pt th:last-child { border-right: 1px solid var(--line); border-radius: 0 6px 0 0; }
.pt th button { display: inline-flex; align-items: center; gap: 6px; height: 30px; margin-left: -6px; padding: 0 6px; border: 0; border-radius: 4px; background: transparent; font: inherit; color: inherit; }
.pt th button:hover { background: var(--panel-2); color: var(--ink); }
.pt th[aria-sort] button { color: var(--blue); }
.pt th svg { flex: none; }
.pt td { padding: 10px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.pt td:first-child { padding-left: 10px; }
.pt tbody tr:hover td { background: #f8fafb; }
.pt .num { text-align: right; }
.pt th.num button { margin-left: 0; margin-right: -6px; }
.thumb { display: grid; place-items: center; width: 48px; height: 48px; border: 1px solid var(--line-2); border-radius: 4px; background: #fff; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: contain; }
.thumb .noimg { font-size: 13px; color: var(--ink-3); text-align: center; line-height: 1.1; }
.c-brand { font-weight: 500; white-space: nowrap; }
.c-name a { font-weight: 500; text-decoration: none; }
.c-name a:hover { color: var(--blue); text-decoration: underline; text-underline-offset: 3px; }
.c-line { display: block; font-size: 13px; color: var(--ink-3); }
.lowres { display: inline-block; margin-top: 2px; font-size: 13px; color: #8a4b00; }
.c-vol { white-space: nowrap; color: var(--ink-2); }
.c-art { font: 400 14px/1.4 var(--mono); white-space: nowrap; }
.c-price { font: 500 15px/1.4 var(--mono); white-space: nowrap; }
.c-qty, .c-add { width: 1%; white-space: nowrap; }
.c-add { padding-right: 10px; }
.incart { display: block; margin-top: 3px; font: 500 13px/1.2 var(--mono); color: var(--blue); text-align: center; }
.incart:empty { display: none; }
.m-only { display: none; }
.empty { padding: 40px 24px; border: 1px dashed var(--line); border-radius: 8px; text-align: center; margin-top: 12px; }
.empty h2 { font-size: 20px; margin-bottom: 8px; }
.empty p { color: var(--ink-2); max-width: 56ch; margin: 0 auto 16px; }

/* ---------- корзина-заявка ---------- */
.dock { position: sticky; top: var(--hdr); align-self: start; height: calc(100vh - var(--hdr) - 34px); border-left: 1px solid var(--line); background: var(--panel); }
.cart-in { display: flex; flex-direction: column; height: 100%; }
.cart-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }
.cart-h h2 { font-size: 18px; }
.cart-h .cnt { font-size: 13px; }
.cart-list { flex: 1; overflow: auto; padding: 4px 20px; }
.cart-list:focus-visible { outline-offset: -3px; }
.ci { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.ci a { font-weight: 500; font-size: 14px; line-height: 1.35; text-decoration: none; }
.ci a:hover { text-decoration: underline; text-underline-offset: 3px; }
.ci-meta { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.ci-art { font: 400 13px/1.3 var(--mono); color: var(--ink-3); }
.ci .step { height: 32px; }
.ci .step button { width: 28px; }
.ci-sum { font: 500 14px/1 var(--mono); white-space: nowrap; }
.rm { width: 28px; height: 28px; border: 0; border-radius: 4px; background: transparent; color: var(--ink-3); font-size: 18px; line-height: 1; }
.rm:hover { background: var(--panel-2); color: var(--ink); }
.cart-empty { padding: 20px 0; color: var(--ink-2); font-size: 14px; }
.cart-f { padding: 14px 20px 18px; border-top: 1px solid var(--line); background: #fff; }
.cart-total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-weight: 600; font-size: 16px; }
.cart-total b { font: 500 20px/1 var(--mono); }
.cart-f .note { margin-top: 6px; }
.cart-f .btn { width: 100%; margin-top: 10px; }
.cart-tools { display: flex; justify-content: space-between; gap: 10px; margin-top: 10px; }
.cart-tools button { padding: 4px 0; border: 0; background: transparent; color: var(--blue); font-size: 14px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
.cart-tools button:hover { color: var(--blue-h); }
dialog.cart { width: min(420px, 100vw); max-width: 100vw; height: 100dvh; max-height: 100dvh; margin: 0 0 0 auto; padding: 0; border: 0; background: var(--panel); color: var(--ink); }
dialog.cart::backdrop { background: rgba(27,30,35,.5); }
dialog.cart[open] { animation: slide .2s ease-out; }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } }
.x { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: var(--r); background: #fff; font-size: 20px; line-height: 1; }

/* ---------- карточка товара ---------- */
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 20px; font-size: 14px; color: var(--ink-3); }
.crumbs a { color: var(--ink-2); text-underline-offset: 3px; }
.pd { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(24px, 4vw, 56px); padding-block: 18px 32px; }
.pd-media { position: sticky; top: calc(var(--hdr) + 20px); align-self: start; }
.pd-img { display: grid; place-items: center; aspect-ratio: 1; border: 1px solid var(--line-2); border-radius: 8px; background: #fff; padding: 24px; }
.pd-img img { width: 100%; height: 100%; object-fit: contain; }
.pd-img .noimg { color: var(--ink-3); }
.pd-media .lowres-note { margin-top: 10px; padding: 10px 12px; border-left: 3px solid #b86a00; background: #fff6e8; font-size: 14px; color: #5c3800; }
.pd-brand { font: 500 14px/1.4 var(--mono); color: var(--ink-2); }
.pd-brand a { color: inherit; text-underline-offset: 3px; }
.pd h1 { margin-top: 8px; font-size: clamp(24px, 2.6vw, 34px); letter-spacing: -.02em; }
.pd-vol { margin-top: 4px; font-size: 17px; color: var(--ink-2); }
.pass { width: 100%; margin-top: 20px; border-collapse: collapse; font-size: 14px; }

.buy-row .btn { height: 44px; padding: 0 22px; }

.vols { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.vols a { display: inline-flex; flex-direction: column; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; font-weight: 500; }
.vols a span { font: 400 13px/1.4 var(--mono); color: var(--ink-3); }
.vols a[aria-current="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }

footer { margin-top: 40px; border-top: 1px solid var(--line); background: var(--panel); font-size: 14px; color: var(--ink-2); }

body[data-page="catalog"] footer { margin-top: 0; }

@media (max-width: 1199px) { .pt th { top: var(--hdr); } }
@media (max-width: 1100px) {
  .cols { grid-template-columns: 1fr; }

}

  .pt, .pt tbody { display: block; }

  .pt tr { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto auto; grid-template-areas: "img brand brand brand" "img name name name" "img vol vol vol" "price price qty add"; gap: 2px 10px; padding: 12px 0; border-bottom: 1px solid var(--line-2); }
  .pt td { display: block; padding: 0; border: 0; }
  .pt tbody tr:hover td { background: transparent; }
  .pt .c-img { grid-area: img; }

  .pt .c-brand { grid-area: brand; font-size: 13px; font-family: var(--mono); color: var(--ink-2); white-space: normal; }
  .pt .c-brand .m-only { display: inline; color: var(--ink-3); }
  .pt .c-name { grid-area: name; }

}

  .how li, .how li + li { padding: 16px 0; border-left: 0; border-top: 1px solid var(--line-2); }
  .how li:first-child { border-top: 0; }

}
@media (max-width: 760px) {
  .hdr-in { flex-wrap: wrap; height: auto; gap: 0 12px; padding-block: 10px 0; }
  .logo { height: 40px; }
  .nav { order: 3; flex: 1 1 100%; margin: 6px calc(var(--pad) * -1) 0; padding-inline: calc(var(--pad) - 4px); border-top: 1px solid var(--graphite-2); }
  .nav a { height: 42px; }
  .hsearch { order: 4; flex: 1 1 100%; max-width: none; margin: 0 0 10px; }
  .cart-btn { gap: 8px; padding: 0 12px; }
  body[data-page="product"] .cart-btn { margin-left: auto; }
  .qo-row { flex-direction: column; }
  .qo input { height: 56px; font-size: 18px; padding-left: 46px; }
  .qo-field svg { left: 14px; }
  .qo input::placeholder { font-size: 16px; }
  .qo .btn { height: 48px; width: 100%; }
  .dir { columns: 1; }
  .fbar { padding: 8px; }
  .f-q { flex-basis: 100%; }
  .f-sel { flex: 1 1 calc(50% - 4px); }
  .f-sel select { width: 100%; min-width: 0; max-width: none; }
  .f-kind { flex: 1 1 100%; }
  .f-kind a { flex: 1; justify-content: center; }
  .f-reset { margin-left: 0; }
  .buy-price b { font-size: 26px; }
}
@media (max-width: 420px) {
  .ways li { flex-direction: column; gap: 0; }
  .ways li span:last-child { text-align: left; }
  .pt tr { grid-template-columns: 56px minmax(0, 1fr) auto; grid-template-areas: "img brand brand" "img name name" "img vol vol" "price qty add"; }
  .pt .c-price { font-size: 15px; }
  .add { padding: 0 10px; }

}

<body data-page="home">
<a class="tc-skip" href="#main" id="skip">К содержанию</a>
<header class="hdr">
  <div class="wrap hdr-in">
    <a class="logo" href="#home">TOP Cosmetics <i>прайс</i></a>
    <nav class="nav" aria-label="Основное" id="nav"></nav>
    <form class="hsearch" role="search" id="hsearch">
      <label class="visually-hidden" for="hq">Поиск по прайсу</label>
      <input id="hq" name="q" type="search" placeholder="Артикул, бренд или название" autocomplete="off">
    </form>
    <button class="cart-btn" type="button" id="cartOpen" aria-haspopup="dialog"><span class="lbl">Заявка</span><b id="cartCount">0</b><span class="sum" id="cartSum">0&nbsp;₽</span><span class="visually-hidden"> — открыть демо-корзину</span></button>
  </div>
</header>
<div class="shell">
  <main id="main"></main>
  <aside class="dock" id="dock" aria-labelledby="dockTitle">
    <div class="cart-in">
      <div class="cart-h"><h2 id="dockTitle" tabindex="-1">Заявка</h2><span class="cnt" data-cart-count></span></div>
      <div class="cart-list" data-cart-list></div>
      <div class="cart-f" data-cart-foot></div>
    </div>
  </aside>
</div>
<footer>
  <div class="wrap">
    <div><b>TOP Cosmetics</b><br><span id="storeAddr"></span></div>
    <div><a id="storePhone"></a><br><span id="storeHours"></span></div>
    <div>Прототип A2 «Кабинет». Цены, названия и фото — снимок публичного каталога сайта на 15.11.2026.</div>
  </div>
</footer>
<dialog class="cart" id="cart" aria-labelledby="cartTitle">
  <div class="cart-in">
    <div class="cart-h"><h2 id="cartTitle">Заявка <span class="cnt" data-cart-count></span></h2><button class="x" type="button" id="cartClose" aria-label="Закрыть заявку">×</button></div>
    <div class="cart-list" data-cart-list></div>
    <div class="cart-f" data-cart-foot></div>
  </div>
</dialog>
<script src="shared/data.js"></script>
<script src="shared/engine.js"></script>
<script>
(function () {
  const { esc, money, img, href } = TC
  const $ = (s, el = document) => el.querySelector(s)
  const $$ = (s, el = document) => [...el.querySelectorAll(s)]
  const main = $('#main')
  const nf = new Intl.NumberFormat('ru-RU')
  TC.ribbon('A2 «Кабинет»')

  const st = TC.store
  $('#storeAddr').textContent = st.address
  $('#storePhone').textContent = st.phone; $('#storePhone').href = st.phoneHref
  $('#storeHours').textContent = st.hours
  $('#skip').addEventListener('click', (e) => { e.preventDefault(); const h = $('main h1'); if (h) { h.setAttribute('tabindex', '-1'); h.focus() } })

  // ---------- сортировка по колонкам ----------
  const cmpArt = (a, b) => String(a.article || '').localeCompare(String(b.article || ''), 'ru', { numeric: true })
  const MY = {
    brand: (a, b) => a.brand.localeCompare(b.brand, 'en') || a.kind.localeCompare(b.kind, 'ru'),
    'brand-desc': (a, b) => b.brand.localeCompare(a.brand, 'en') || a.kind.localeCompare(b.kind, 'ru'),
    name: (a, b) => a.kind.localeCompare(b.kind, 'ru'),
    'name-desc': (a, b) => b.kind.localeCompare(a.kind, 'ru'),
    article: cmpArt,
    'article-desc': (a, b) => cmpArt(b, a),
  }
  const COLS = { brand: ['brand', 'brand-desc'], name: ['name', 'name-desc'], article: ['article', 'article-desc'], price: ['price-asc', 'price-desc'] }
  const SORT_LABELS = { popular: 'Как на сайте', 'price-asc': 'Цена ↑', 'price-desc': 'Цена ↓', name: 'Название А–Я', 'name-desc': 'Название Я–А', brand: 'Бренд А–Z', 'brand-desc': 'Бренд Z–A', article: 'Артикул ↑', 'article-desc': 'Артикул ↓' }
  function list(prm) {
    const s = prm.sort
    const l = TC.filter({ ...prm, sort: MY[s] ? undefined : s })
    if (MY[s]) l.sort(MY[s])
    return l
  }

  // ---------- строка прайса ----------
  const rowQty = new Map()
  const inCart = (id) => (TC.cart.state().items.find((x) => x.id === id) || {}).qty || 0
  const inCartTxt = (id) => { const n = inCart(id); return n ? `в заявке: ${n}` : '' }
  function stepper(id, label) {
    const n = rowQty.get(id) || 1
    return `<div class="step" role="group" aria-label="Количество: ${esc(label)}"><button type="button" data-rq="${id}" data-d="-1" aria-label="Меньше">−</button><output data-rqo="${id}" aria-live="polite">${n}</output><button type="button" data-rq="${id}" data-d="1" aria-label="Больше">+</button></div>`
  }
  function row(p, q) {
    const src = img(p)
    return `<tr>
      <td class="c-img"><a class="thumb" href="${href('product', {}, p.id)}" tabindex="-1" aria-hidden="true">${src ? `<img src="${src}" alt="" width="48" height="48" loading="lazy">` : '<span class="noimg">нет фото</span>'}</a></td>
      <td class="c-brand">${TC.mark(p.brand, q)}<span class="m-only"> · арт. ${TC.mark(p.article || '—', q)}</span></td>
      <td class="c-name"><a href="${href('product', {}, p.id)}">${TC.mark(p.kind, q)}</a>${p.line ? `<span class="c-line">${TC.mark(p.line, q)}</span>` : ''}${p.lowRes ? '<span class="lowres">фото низкого разрешения</span>' : ''}</td>
      <td class="c-vol">${esc(p.volume)}</td>
      <td class="c-art">${TC.mark(p.article || '—', q)}</td>
      <td class="c-price num">${money(p.price)}</td>
      <td class="c-qty">${stepper(p.id, p.name)}</td>
      <td class="c-add"><button class="btn add" type="button" data-add="${p.id}" aria-label="В корзину: ${esc(p.name)}">В корзину</button><span class="incart" data-incart="${p.id}">${inCartTxt(p.id)}</span></td>
    </tr>`
  }
  const arrow = (dir) => dir === 'ascending' ? '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1 9 7H1z" fill="currentColor"/></svg>' : dir === 'descending' ? '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 9 1 3h8z" fill="currentColor"/></svg>' : '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1 8 4H2zM5 9 2 6h6z" fill="currentColor" opacity=".55"/></svg>'
  function th(col, label, cls = '', sort) {
    if (!sort) return `<th scope="col" class="${cls}">${label}</th>`
    const [asc, desc] = COLS[col]
    const dir = sort === asc ? 'ascending' : sort === desc ? 'descending' : null
    const next = dir === 'ascending' ? 'по убыванию' : dir === 'descending' ? 'как на сайте' : 'по возрастанию'
    return `<th scope="col" class="${cls}" ${dir ? `aria-sort="${dir}"` : ''}><button type="button" data-sortcol="${col}" aria-label="${label}: сортировать ${next}">${label}${arrow(dir)}</button></th>`
  }
  function table(items, { q, sort, sortable = false, caption }) {
    const s = sortable ? (sort || 'popular') : null
    return `<table class="pt">
      <caption class="visually-hidden">${esc(caption)}</caption>
      <thead><tr>
        <th scope="col" class="c-img"><span class="visually-hidden">Фото</span></th>
        ${th('brand', 'Бренд', '', s)}${th('name', 'Название', '', s)}${th('vol', 'Объём')}${th('article', 'Артикул', '', s)}${th('price', 'Цена', 'num', s)}
        <th scope="col">Кол-во</th><th scope="col"><span class="visually-hidden">Действие</span></th>
      </tr></thead>
      <tbody>${items.map((p) => row(p, q)).join('')}</tbody></table>`
  }

  // ---------- шапка ----------
  function renderNav(r) {
    const cur = (cond) => (cond ? 'aria-current="page"' : '')
    const p = r.params
    $('#nav').innerHTML = `<a href="#home" ${cur(r.page === 'home')}>Главная</a>
      <a href="#catalog" ${cur(r.page === 'catalog' && !p.kind)}>Прайс</a>
      <a href="${href('catalog', { kind: 'sample' })}" ${cur(r.page === 'catalog' && p.kind === 'sample')}>Пробники</a>
      <a href="${href('catalog', { kind: 'set' })}" ${cur(r.page === 'catalog' && p.kind === 'set')}>Наборы</a>`
  }
  $('#hsearch').addEventListener('submit', (e) => { e.preventDefault(); TC.go('catalog', { q: $('#hq').value.trim() }) })

  // ---------- главная ----------
  function home() {
    const cnt = (f) => TC.products.filter(f).length
    const site = TC.data.meta.brands
    const dir = TC.tree.map((t) => {
      const n = cnt((p) => p.rootId === t.id)
      const kids = t.children.map((c) => [c, cnt((p) => p.sectionId === c.id)]).filter(([, k]) => k)
      const rest = t.children.length - kids.length
      return `<div class="dir-g"><a class="dir-root" href="${href('catalog', { root: t.id })}"><span>${esc(t.name)}</span><span class="cnt">${n}</span></a>
        ${kids.length ? `<ul>${kids.map(([c, k]) => `<li><a href="${href('catalog', { root: t.id, section: c.id })}"><span>${esc(c.name)}</span><span class="cnt">${k}</span></a></li>`).join('')}</ul>` : ''}
        ${rest ? `<p class="dir-more">Ещё ${rest} ${TC.plural(rest, 'подраздел', 'подраздела', 'подразделов')} на сайте — в прототипе без товаров</p>` : ''}</div>`
    }).join('')
    const brands = site.map(([b, n]) => {
      const k = cnt((p) => p.brand === b)
      const inner = `<span>${esc(b)}</span><span class="cnt">${n}</span><span class="cnt">${k || '—'}</span>`
      return `<li>${k ? `<a href="${href('catalog', { brand: b })}">${inner}</a>` : `<div class="is-off">${inner}</div>`}</li>`
    }).join('')
    main.innerHTML = `
      <section class="hero"><div class="wrap">
        <p class="eyebrow">Прайс-лист · снимок каталога 15.11.2026 · ${TC.products.length} из ${TC.catalogTotal} позиций в прототипе</p>
        <h1>Закупка для кабинета по&nbsp;прайсу</h1>
        <p class="hero-lead">Знаете артикул — введите его. Не помните — ищите по бренду или названию. Позиции собираются в заявку с суммой; оформить её в прототипе нельзя.</p>
        <form class="qo" role="search" id="qo">
          <label for="qoq">Быстрый заказ по артикулу или названию</label>
          <div class="qo-row">
            <div class="qo-field"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="qoq" name="q" type="search" placeholder="C9005, KLAPP или название" autocomplete="off" aria-describedby="qoHint"></div>
            <button class="btn" type="submit">Найти в прайсе</button>
          </div>
          <p class="qo-hint" id="qoHint">Попробуйте: <a href="${href('catalog', { q: 'C9005' })}">C9005</a><a href="${href('catalog', { q: 'KLAPP' })}">KLAPP</a><a href="${href('catalog', { q: 'шампунь' })}">шампунь</a><a href="${href('catalog', { q: 'пробник' })}">пробник</a></p>
        </form>
        <div class="quick" id="quick" hidden></div>
      </div></section>
      <section class="wrap" aria-labelledby="howTitle">
        <h2 class="visually-hidden" id="howTitle">Как работать с прайсом</h2>
        <div class="how"><ol>
          <li><span class="how-n">01 · найти</span><h3>Артикул, бренд или название</h3><p>Поиск понимает артикул из накладной, бренд и тип средства. Можно отфильтровать прайс по разделу и бренду.</p></li>
          <li><span class="how-n">02 · набрать</span><h3>Количество прямо в строке</h3><p>Задайте количество и нажмите «В корзину». Заявка с суммой видна справа на широком экране или по кнопке в шапке.</p></li>
          <li><span class="how-n">03 · согласовать</span><h3>Список — магазину</h3><p>Скопируйте заявку текстом (артикул × количество) и согласуйте цены и наличие с магазином. Оформление в прототипе отключено.</p></li>
        </ol></div>
      </section>
      <div class="wrap">
        <div class="cols">
          <section aria-labelledby="dirTitle">
            <div class="sec-h"><h2 id="dirTitle">Разделы прайса</h2><span class="note">Число — позиций в прототипе</span></div>
            <div class="dir">${dir}</div>
          </section>
          <section aria-labelledby="brTitle">
            <div class="sec-h"><h2 id="brTitle">Бренды</h2><a class="lnk" href="#catalog">Весь прайс</a></div>
            <div class="brands-head" aria-hidden="true"><span>бренд</span><span style="text-align:right">на сайте</span><span style="text-align:right">в прототипе</span></div>
            <ul class="brands" aria-label="Бренды: число позиций на сайте и в прототипе">${brands}</ul>
            <p class="note" style="margin-top:8px">«На сайте» — число в фильтре брендов сайта на 15.11.2026.</p>
          </section>
        </div>
        <section class="pro" aria-labelledby="proTitle">
          <div>
            <h2 id="proTitle">Для специалистов</h2>
            <p>Условия для специалистов уточняются у магазина. В публичных данных сайта их нет, поэтому прототип не показывает особых цен и не обещает скидок — все цены в прайсе одинаковые, как на сайте.</p>
            <p>Перед звонком удобно скопировать заявку: в корзине есть кнопка «Скопировать списком».</p>
            <span class="tag">Отправка заявки магазину в прототипе не подключена</span>
          </div>
          <dl>
            <dt>Телефон</dt><dd><a href="${st.phoneHref}">${esc(st.phone)}</a></dd>
            <dt>Адрес</dt><dd>${esc(st.address)}</dd>
            <dt>Часы</dt><dd>${esc(st.hours)}</dd>
            <dt>Получение</dt><dd>${TC.delivery.map(esc).join(', ')} — стоимость и срок при оформлении</dd>
          </dl>
        </section>
      </div>`
    const inp = $('#qoq'), quick = $('#quick')
    let t = null
    const renderQuick = () => {
      const q = inp.value.trim()
      if (!q) { quick.hidden = true; quick.innerHTML = ''; return }
      const found = TC.filter({ q })
      quick.hidden = false
      quick.innerHTML = `<div class="quick-h"><span class="found" aria-live="polite">Найдено: ${found.length}${found.length > 6 ? ', показаны первые 6' : ''} · ${TC.PRICE_NOTE.toLowerCase()}</span>${found.length ? `<a class="lnk" href="${href('catalog', { q })}">Открыть в прайсе</a>` : ''}</div>` +
        (found.length ? table(found.slice(0, 6), { q, caption: 'Быстрый заказ: найденные позиции' }) : `<div class="empty"><h2>По «${esc(q)}» ничего нет</h2><p>В прототипе ${TC.products.length} позиций из ${TC.catalogTotal}. Проверьте артикул или введите бренд.</p><a class="btn ghost" href="#catalog">Открыть весь прайс</a></div>`)
    }
    inp.addEventListener('input', () => { clearTimeout(t); t = setTimeout(renderQuick, 120) })
    $('#qo').addEventListener('submit', (e) => { e.preventDefault(); TC.go('catalog', { q: inp.value.trim() }) })
  }

  // ---------- каталог ----------
  let refocus = null
  function catalog(r) {
    const prm = r.params
    const brand = [].concat(prm.brand || [])[0] || ''
    const items = list(prm)
    const fc = TC.facets(prm)
    const total = (o) => TC.filter(o).length
    const baseNoKind = { ...prm }; delete baseNoKind.kind
    const root = prm.root ? TC.tree.find((t) => String(t.id) === String(prm.root)) : null
    const title = prm.q ? `Поиск: «${prm.q}»` : brand ? `Прайс ${brand}` : prm.section ? TC.sectionName(prm.section) : root ? root.name : prm.kind === 'sample' ? 'Пробники' : prm.kind === 'set' ? 'Наборы' : 'Прайс-лист'
    const opt = (v, label, n, sel) => `<option value="${esc(v)}" ${sel ? 'selected' : ''}>${esc(label)} · ${n}</option>`
    const allRoot = total({ ...prm, root: '', section: '' })
    const allBrand = total({ ...prm, brand: '' })
    const hasF = prm.q || prm.root || brand || prm.kind || prm.section
    main.innerHTML = `<div class="wrap cat">
      <div class="cat-head">
        <div><p class="eyebrow">Прайс · снимок 15.11.2026</p><h1>${esc(title)}</h1></div>
        <p class="found" aria-live="polite">Найдено ${items.length} из ${TC.products.length} в прототипе · на сайте ${TC.catalogTotal}</p>
      </div>
      <form class="fbar" id="fbar" role="search" aria-label="Поиск и фильтры прайса">
        <div class="f-q"><label class="visually-hidden" for="fq">Поиск по артикулу, бренду или названию</label><input id="fq" name="q" type="search" value="${esc(prm.q || '')}" placeholder="Артикул, бренд или название" autocomplete="off"><button type="submit">Найти</button></div>
        <label class="f-sel"><span>Раздел</span><select name="root" aria-label="Раздел">${opt('', 'Все', allRoot, !prm.root)}${TC.tree.map((t) => opt(t.id, t.name, fc.root.get(t.id) || 0, String(prm.root) === String(t.id))).join('')}</select></label>
        ${root && root.children.length ? `<label class="f-sel"><span>Подраздел</span><select name="section" aria-label="Подраздел">${opt('', 'Все', total({ ...prm, section: '' }), !prm.section)}${root.children.filter((c) => fc.section.get(c.id)).map((c) => opt(c.id, c.name, fc.section.get(c.id) || 0, String(prm.section) === String(c.id))).join('')}</select></label>` : ''}
        <label class="f-sel"><span>Бренд</span><select name="brand" aria-label="Бренд">${opt('', 'Все', allBrand, !brand)}${TC.brands.map((b) => opt(b, b, fc.brand.get(b) || 0, brand === b)).join('')}</select></label>
        <div class="f-kind" role="group" aria-label="Тип позиции">
          <a href="${href('catalog', { ...prm, kind: prm.kind === 'sample' ? '' : 'sample' })}" aria-pressed="${prm.kind === 'sample'}">Пробники <span class="cnt">${total({ ...baseNoKind, kind: 'sample' })}</span></a>
          <a href="${href('catalog', { ...prm, kind: prm.kind === 'set' ? '' : 'set' })}" aria-pressed="${prm.kind === 'set'}">Наборы <span class="cnt">${total({ ...baseNoKind, kind: 'set' })}</span></a>
        </div>
        <label class="f-sel f-sort"><span>Порядок</span><select name="sort" aria-label="Порядок">${Object.entries(SORT_LABELS).map(([k, l]) => `<option value="${k}" ${(prm.sort || 'popular') === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        ${hasF ? '<a class="lnk f-reset" href="#catalog">Сбросить всё</a>' : ''}
      </form>
      <div class="notes"><p class="note">${TC.PRICE_NOTE}.</p><p class="note">${TC.STOCK_NOTE}.</p><p class="note">Сортировка — клик по заголовку колонки.</p></div>
      ${items.length ? table(items, { q: prm.q, sort: prm.sort, sortable: true, caption: `${title}: ${items.length} позиций` }) :
        `<div class="empty"><h2>Ничего не нашли${prm.q ? ` по «${esc(prm.q)}»` : ''}</h2><p>В прототипе ${TC.products.length} позиций из ${TC.catalogTotal}. Проверьте артикул, введите бренд (например, KLAPP) или тип средства — «шампунь».</p><a class="btn" href="#catalog">Сбросить поиск и фильтры</a></div>`}
    </div>`
    const fbar = $('#fbar')
    fbar.addEventListener('submit', (e) => { e.preventDefault(); refocus = '#fq'; TC.go('catalog', { ...prm, q: $('#fq').value.trim() }) })
    fbar.addEventListener('change', (e) => {
      const el = e.target; if (el.tagName !== 'SELECT') return
      const next = { ...prm, [el.name]: el.value }
      if (el.name === 'root') delete next.section
      refocus = `#fbar [name="${el.name}"]`
      TC.go('catalog', next)
    })
    main.querySelectorAll('[data-sortcol]').forEach((b) => b.addEventListener('click', () => {
      const [asc, desc] = COLS[b.dataset.sortcol]
      const nextSort = prm.sort === asc ? desc : prm.sort === desc ? '' : asc
      refocus = `[data-sortcol="${b.dataset.sortcol}"]`
      TC.go('catalog', { ...prm, sort: nextSort })
    }))
    if (refocus) { const el = $(refocus); if (el) el.focus({ preventScroll: true }); refocus = null }
  }

  // ---------- товар ----------
  function product(r) {
    const p = TC.byId.get(r.id)
    if (!p) { main.innerHTML = `<div class="wrap"><div class="empty" style="margin-top:40px"><h1>Позиция не найдена</h1><p>Возможно, её нет в прототипе.</p><a class="btn" href="#catalog">Открыть прайс</a></div></div>`; return }
    const src = img(p)
    const vols = p.volumeGroup ? p.volumeGroup.map((id) => TC.byId.get(id)).filter(Boolean) : null
    const sample = p.sampleId && TC.byId.get(p.sampleId), full = p.fullSizeId && TC.byId.get(p.fullSizeId)
    const rel = TC.products.filter((x) => x.id !== p.id && (p.sectionId ? x.sectionId === p.sectionId : x.rootId === p.rootId)).slice(0, 8)
    const paras = p.description ? p.description.split('\n').filter(Boolean).map((t) => `<p>${esc(t)}</p>`).join('') : ''
    main.innerHTML = `<div class="wrap">
      <nav class="crumbs" aria-label="Навигация"><a href="#catalog">Прайс</a><span aria-hidden="true">/</span><a href="${href('catalog', { root: p.rootId })}">${esc(p.root)}</a>${p.section ? `<span aria-hidden="true">/</span><a href="${href('catalog', { root: p.rootId, section: p.sectionId })}">${esc(p.section)}</a>` : ''}</nav>
      <div class="pd">
        <div class="pd-media">
          <div class="pd-img">${src ? `<img src="${src}" alt="${esc(p.name)}" width="600" height="600">` : '<p class="noimg">Фото на сайте нет</p>'}</div>
          ${p.lowRes ? '<p class="lowres-note">Фото на сайте низкого разрешения — для витрины нужна замена от бренда или съёмка.</p>' : ''}
        </div>
        <div>
          <p class="pd-brand"><a href="${href('catalog', { brand: p.brand })}">${esc(p.brand)}</a>${p.line ? ' · ' + esc(p.line) : ''}</p>
          <h1>${esc(p.kind)}</h1>
          <p class="pd-vol">${esc(p.volume)}</p>
          ${vols ? `<div class="vols" role="group" aria-label="Объёмы">${vols.map((v) => `<a href="${href('product', {}, v.id)}" aria-current="${v.id === p.id}">${esc(v.volume)}<span>${money(v.price)} · ${esc(v.article)}</span></a>`).join('')}</div>` : ''}
          ${sample ? `<p style="margin-top:12px">Есть пробник: <a class="lnk" href="${href('product', {}, sample.id)}">${esc(sample.volume)}, ${money(sample.price)}</a></p>` : ''}
          ${full ? `<p style="margin-top:12px">Полный объём: <a class="lnk" href="${href('product', {}, full.id)}">${esc(full.volume)}, ${money(full.price)}</a></p>` : ''}
          <table class="pass">
            <caption>Паспорт позиции</caption>
            <tbody>
              <tr><th scope="row">ID в Битрикс</th><td class="mono">${p.id}</td></tr>
              <tr><th scope="row">Артикул</th><td class="mono">${esc(p.article || 'не указан')}</td></tr>
              <tr><th scope="row">XML_ID</th><td class="na">не опубликован на сайте</td></tr>
              <tr><th scope="row">Раздел</th><td>${esc(p.root)}${p.section ? ' / ' + esc(p.section) : ''}</td></tr>
              <tr><th scope="row">Исходное название</th><td>${esc(p.sourceName)}</td></tr>
              <tr><th scope="row">Наличие</th><td>${TC.STOCK_NOTE}</td></tr>
            </tbody>
          </table>
          <div class="buy">
            <div class="buy-price"><b>${money(p.price)}</b><span class="note">${TC.PRICE_NOTE}</span></div>
            <div class="buy-row">
              ${stepper(p.id, p.name)}
              <button class="btn" type="button" data-add="${p.id}">В корзину</button>
              <span class="incart" data-incart="${p.id}">${inCartTxt(p.id)}</span>
            </div>
            <ul class="ways" aria-label="Способы получения">${TC.delivery.map((d) => `<li><span>${esc(d)}</span><span>стоимость и срок — при оформлении</span></li>`).join('')}</ul>
          </div>
        </div>
      </div>
      <div class="doc">
        <section class="desc"><h2>Описание</h2>${paras || '<p class="missing">Описания на сайте нет.</p>'}</section>
        <div>
          <section><h2>Применение</h2>${p.hasUsage ? '<p>Способ применения есть в описании выше.</p>' : '<p class="missing">На сайте отдельно не указано.</p>'}</section>
          <section style="margin-top:20px"><h2>Состав</h2>${p.hasComposition ? '<p>Состав упоминается в описании выше.</p>' : '<p class="missing">На сайте отдельно не указано.</p>'}</section>
        </div>
      </div>
      ${rel.length ? `<section class="rel" aria-labelledby="relTitle"><div class="sec-h" style="margin-top:8px"><h2 id="relTitle">Ещё в разделе «${esc(p.section || p.root)}»</h2><a class="lnk" href="${href('catalog', p.sectionId ? { root: p.rootId, section: p.sectionId } : { root: p.rootId })}">Весь раздел в прайсе</a></div>
        <p class="note" style="margin-bottom:8px">${TC.PRICE_NOTE}.</p>${table(rel, { caption: 'Ещё в разделе' })}</section>` : ''}
    </div>`
  }

  // ---------- корзина-заявка ----------
  const dlg = $('#cart'), dock = $('#dock')
  const dockOn = () => getComputedStyle(dock).display !== 'none'
  $('#cartOpen').addEventListener('click', () => { if (dockOn()) { $('#dockTitle').focus(); TC.toast('Заявка — в панели справа.') } else dlg.showModal() })
  $('#cartClose').addEventListener('click', () => dlg.close())
  dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close() })
  function renderCart(s) {
    $('#cartCount').textContent = s.count
    $('#cartSum').innerHTML = esc(money(s.total))
    const pos = s.items.length
    $$('[data-cart-count]').forEach((el) => { el.textContent = pos ? `${pos} ${TC.plural(pos, 'позиция', 'позиции', 'позиций')} · ${s.count} шт.` : 'пусто' })
    const listHtml = pos ? s.items.map(({ product: p, qty: n }) => `<div class="ci">
        <a href="${href('product', {}, p.id)}">${esc(p.brand)} · ${esc(p.kind)}, ${esc(p.volume)}</a>
        <button class="rm" type="button" data-rm="${p.id}" aria-label="Убрать из заявки: ${esc(p.name)}">×</button>
        <div class="ci-meta"><span class="ci-art">арт. ${esc(p.article || '—')}</span>
          <div class="step" role="group" aria-label="Количество в заявке"><button type="button" data-cq="${p.id}" data-d="-1" aria-label="Меньше">−</button><output>${n}</output><button type="button" data-cq="${p.id}" data-d="1" aria-label="Больше">+</button></div>
          <span class="ci-sum">${money((p.price || 0) * n)}</span></div></div>`).join('') :
      '<p class="cart-empty">Заявка пуста. Задайте количество в строке прайса и нажмите «В корзину».</p>'
    const foot = `<div class="cart-total"><span>Сумма</span><b>${money(s.total)}</b></div>
      <p class="note">По ценам снимка 15.11.2026, без доставки. ${TC.STOCK_NOTE}.</p>
      <button class="btn" type="button" aria-disabled="true" data-checkout>Оформление недоступно в прототипе</button>
      ${pos ? '<div class="cart-tools"><button type="button" data-copy>Скопировать списком</button><button type="button" data-clear>Очистить</button></div>' : ''}`
    $$('[data-cart-list]').forEach((el) => { el.innerHTML = listHtml })
    $$('[data-cart-foot]').forEach((el) => { el.innerHTML = foot })
    $$('[data-incart]').forEach((el) => { el.textContent = inCartTxt(Number(el.dataset.incart)) })
  }
  TC.cart.on(renderCart)

  document.addEventListener('click', (e) => {
    const t = e.target
    const add = t.closest('[data-add]')
    if (add) { const id = Number(add.dataset.add); TC.cart.add(id, rowQty.get(id) || 1); rowQty.delete(id); $$(`[data-rqo="${id}"]`).forEach((o) => { o.textContent = 1 }); return }
    const rq = t.closest('[data-rq]')
    if (rq) { const id = Number(rq.dataset.rq); const n = Math.max(1, Math.min(99, (rowQty.get(id) || 1) + Number(rq.dataset.d))); rowQty.set(id, n); $$(`[data-rqo="${id}"]`).forEach((o) => { o.textContent = n }); return }
    const cq = t.closest('[data-cq]')
    if (cq) { const id = Number(cq.dataset.cq); TC.cart.set(id, inCart(id) + Number(cq.dataset.d)); return }
    const rm = t.closest('[data-rm]')
    if (rm) { TC.cart.remove(Number(rm.dataset.rm)); return }
    if (t.closest('[data-checkout]')) { TC.toast('Оформление недоступно в прототипе: заказ не создаётся, оплата не проводится.'); return }
    if (t.closest('[data-clear]')) { TC.cart.clear(); return }
    if (t.closest('[data-copy]')) {
      const s = TC.cart.state()
      const text = s.items.map(({ product: p, qty: n }) => `${p.article || 'ID ' + p.id} — ${p.brand} ${p.kind}, ${p.volume} × ${n}`).join('\n') + `\nСумма по ценам снимка: ${nf.format(s.total)} ₽`
      const ok = () => TC.toast('Список скопирован. Отправка магазину в прототипе не подключена.')
      try { navigator.clipboard.writeText(text).then(ok, () => TC.toast('Не удалось скопировать: браузер не дал доступ к буферу.')) } catch (err) { TC.toast('Не удалось скопировать: браузер не дал доступ к буферу.') }
      return
    }
    if (t.closest('.cart-list a')) dlg.close()
  })

  TC.onRoute((r) => {
    document.body.dataset.page = r.page === 'catalog' || r.page === 'product' ? r.page : 'home'
    renderNav(r)
    $('#hq').value = ''
    if (r.page === 'catalog') catalog(r)
    else if (r.page === 'product') product(r)
    else home()
    const p = r.page === 'product' && TC.byId.get(r.id)
    document.title = (p ? p.name + ' — ' : r.page === 'catalog' ? 'Прайс — ' : '') + 'A2 · Кабинет — прототип TOP Cosmetics'
  })
})()
</script>
</body>
</html>
