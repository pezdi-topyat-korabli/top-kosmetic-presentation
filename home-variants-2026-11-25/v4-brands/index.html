  <!-- 1. Преимущества: одна компактная строка с галочками — самый верх страницы. -->
  <aside class="bar" data-req="benefits" aria-label="Преимущества магазина">
    <ul class="bar__list wrap" data-slot="benefits"></ul>
  </aside>

  <!-- 2. Шапка (липкая строка): логотип, каталог, поиск, кабинет, корзина. -->
  <header class="hdr" data-req="header">
    <div class="hdr__row wrap">
      <a class="logo" href="#" aria-label="TOP Cosmetics — на главную">
        <svg aria-hidden="true" focusable="false"><use href="#logo"/></svg>
      </a>
      <button class="btn btn--blue hdr__catalog" type="button">
        <svg class="ic" aria-hidden="true" focusable="false"><use href="#i-menu"/></svg><span>Каталог</span>

      <form class="search" role="search" action="#">
        <label class="sr-only" for="q">Поиск по каталогу</label>
        <input class="search__input" id="q" type="search" name="q" placeholder="Бренд, средство или задача" autocomplete="off">
        <button class="search__go" type="submit" aria-label="Найти"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-search"/></svg></button>
      </form>
      <nav class="hdr__acts" aria-label="Кабинет">
        <a class="hdr__act" href="#"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-heart"/></svg><span>Избранное</span></a>
        <a class="hdr__act" href="#"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-user"/></svg><span>Войти</span></a>
        <a class="hdr__cart" href="#" data-cart-target>
          <span class="hdr__cart-ic"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-basket"/></svg></span><span>Корзина</span><b class="badge" data-cart-count hidden>0</b>
        </a>
      </nav>
      <a class="hdr__pick" href="#tasks">
        <svg class="ic ic--o" aria-hidden="true" focusable="false"><use href="#o"/></svg><span>Подбор по задаче</span>
      </a>
    </div>
  </header>

  <nav class="nav" aria-label="Разделы каталога">
    <div class="nav__row wrap">
      <ul class="nav__list" data-slot="nav"></ul>
      <a class="nav__pick" href="#tasks" data-slot="nav-pick">
        <svg class="ic ic--o" aria-hidden="true" focusable="false"><use href="#o"/></svg><span></span>
      </a>
    </div>
  </nav>

  <main id="main">
    <!-- 3. Бренды — все 12 логотипов в белых капсулах сразу под шапкой: неподвижная витрина
         (на компьютере один ряд, на планшете сетка, на телефоне ряд листается пальцем). -->
    <section class="brands" data-req="brands" aria-labelledby="brands-title">
      <div class="brands__in wrap">
        <p class="brands__title" id="brands-title">Бренды <span class="brands__count" data-slot="brand-count"></span></p>
        <a class="brands__all" href="#">Все бренды<svg class="ic" aria-hidden="true" focusable="false"><use href="#i-chev"/></svg></a>
        <ul class="brands__row" data-slot="brand-row" aria-labelledby="brands-title"></ul>
      </div>
    </section>

    <!-- 4. Витрина: заголовок, подзаголовок и кнопки слева одним блоком, под ними капсульная карусель
         четырёх подборок (капсула раскрывается, как «O» логотипа). Прогресс и пауза — один пульт под каруселью. -->
    <section class="hero" data-req="hero" aria-labelledby="hero-title">
      <div class="wrap">
        <div class="mast" data-slot="mast"></div>
        <div class="stage">
          <div class="acc" data-slot="acc" role="region" aria-roledescription="карусель" aria-label="Подборки TOP Cosmetics"></div>
          <div class="acc-ctrl">
            <div class="acc-dots" data-slot="acc-dots" role="group" aria-label="Слайды"></div>
            <button class="acc-pause" type="button" aria-pressed="false" aria-label="Остановить автопрокрутку">
              <svg class="ic ic--pause" aria-hidden="true" focusable="false"><use href="#i-pause"/></svg>
              <svg class="ic ic--play" aria-hidden="true" focusable="false"><use href="#i-play"/></svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- 5. Быстрые категории — девять высоких капсул с крупным товаром на белой диагональной капсуле
         (как свёрнутые капсулы карусели). Все девять видны сразу: ряд на компьютере, сетка 3×3 на телефоне. -->
    <section class="cats" data-req="categories" aria-labelledby="cats-title">
      <div class="wrap">
        <div class="sec-head">
          <h2 class="sec-title" id="cats-title">Быстрые категории</h2>
          <a class="more" href="#catalog">Смотреть все <svg class="ic more__ic" aria-hidden="true" focusable="false"><use href="#i-chev"/></svg></a>
        </div>
        <ul class="cats__grid" data-slot="cats"></ul>
      </div>
    </section>

    <!-- 6. Подбор по задаче — задача, описание и товар в «O» логотипа (сразу за категориями, как в понравившихся «Клинике» и «Ритейле»). -->
    <section class="tasks" id="tasks" data-req="tasks" aria-labelledby="tasks-title">
      <div class="wrap">
        <div class="sec-head">
          <h2 class="sec-title" id="tasks-title">Подбор по задаче</h2>
        </div>
        <ul class="tasks__grid" data-slot="tasks"></ul>
      </div>
    </section>

    <!-- 7. Товары — карточки без рамок, фото на голубой подложке, круглая кнопка-корзина. -->
    <section class="shop" id="catalog" data-req="products" aria-labelledby="shop-title">
      <div class="wrap">
        <div class="sec-head sec-head--shop">
          <h2 class="sec-title" id="shop-title">В каталоге</h2>
          <div class="tabs" role="tablist" aria-label="Раздел каталога" data-slot="tabs"></div>
          <a class="more" href="#">Смотреть все <svg class="ic more__ic" aria-hidden="true" focusable="false"><use href="#i-chev"/></svg></a>
        </div>
        <ul class="grid" data-slot="grid" id="grid" role="tabpanel" aria-labelledby="shop-title"></ul>
      </div>
    </section>

    <!-- 8. Двойное промо в конце: стена брендов + вход в подбор по задаче с товарами. -->
    <section class="duo" aria-label="Бренды и подбор по задаче">
      <div class="duo__grid wrap" data-slot="duo"></div>
    </section>
  </main>
