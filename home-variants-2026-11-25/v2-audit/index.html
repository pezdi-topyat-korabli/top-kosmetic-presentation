<!-- 1. Преимущества: компактная строка с галочками в капсулах, самый верх страницы.
     Планшет и телефон — неподвижная сетка 2×2: все четыре пункта целиком, без прокрутки и затухания. -->
<div class="benefits" data-req="benefits" role="region" aria-label="Преимущества магазина">
  <div class="wrap benefits__viewport">
    <ul class="benefits__list" data-slot="benefits"></ul>
  </div>
</div>

<!-- 2. Шапка как в аудите: логотип, широкий поиск, избранное, вход, синяя капсула корзины.
     Телефон: поиск во всю ширину под логотипом, липкий; «Поиск» в нижней панели ставит в него курсор. -->
<header class="header" data-req="header">
  <div class="wrap header__row">
    <a class="logo" href="#" aria-label="TOP Cosmetics — на главную"><svg viewBox="0 0 398 133" aria-hidden="true"><use href="#logo"/></svg></a>
    <form class="search" role="search">
      <svg class="search__ico" aria-hidden="true"><use href="#i-search"/></svg>
      <input class="search__input" id="q" type="search" name="q" placeholder="Бренд, средство или задача" aria-label="Поиск по каталогу" autocomplete="off" enterkeyhint="search">
    </form>
    <a class="header__task" href="#tasks"><span class="capsule-ico" aria-hidden="true"></span>Подбор по задаче</a>
    <div class="actions">
      <a class="action" href="#"><svg aria-hidden="true"><use href="#i-heart"/></svg><span>Избранное</span></a>
      <a class="action" href="#"><svg aria-hidden="true"><use href="#i-user"/></svg><span>Войти</span></a>
      <a class="cart" href="#" data-cart-target aria-label="Корзина">
        <svg aria-hidden="true"><use href="#i-basket"/></svg><span class="cart__label">Корзина</span>
        <b class="badge" data-cart-count hidden>0</b>
      </a>
    </div>
  </div>
</header>

<nav class="nav" aria-label="Разделы каталога">
  <div class="wrap nav__row" data-slot="nav"></div>
</nav>

<main id="main">

  <!-- 3. Бренды — сразу под навигацией: синяя капсула-лента, белый «колпачок» со счётчиком -->
  <section class="brands" id="brands" data-req="brands" aria-label="Бренды">
    <div class="wrap">
      <div class="brands__bar">
        <div class="brands__scroller">
          <ul class="brands__list" data-slot="brands"></ul>
        </div>
        <!-- Число брендов — длина списка в данных; на телефоне подпись скрыта визуально, но остаётся именем ссылки -->
        <a class="brands__all" href="#"><span class="brands__all-t">Все <span data-slot="brand-count"></span> брендов</span><svg aria-hidden="true"><use href="#i-next"/></svg></a>
      </div>
    </div>
  </section>

  <!-- 4. Первый экран: белая карточка с заголовком + синяя карточка «Новинка» + капсула «Пробники» -->
  <section class="hero wrap" data-req="hero" aria-labelledby="hero-h">
    <div class="hero__main" data-slot="hero-main"></div>
    <div class="hero__side" data-slot="hero-side"></div>
  </section>

  <!-- 5. Подбор по задаче: чипы из аудита стали капсулами с товаром и описанием, на синей ленте во всю ширину -->
  <section class="tasks" id="tasks" data-req="tasks" aria-labelledby="tasks-h">
    <div class="tasks__panel">
      <div class="wrap">
        <div class="sec-head sec-head--on-blue">
          <h2 class="sec-title" id="tasks-h">Подбор по задаче</h2>
          <a class="more more--on-blue" href="#"><span>Смотреть все</span><svg aria-hidden="true"><use href="#i-next"/></svg></a>
        </div>
        <ul class="tasks__grid" data-slot="tasks"></ul>
      </div>
    </div>
  </section>

  <!-- 6. Быстрые категории: высокие капсулы с товаром -->
  <section class="cats wrap" id="cats" data-req="categories" aria-labelledby="cats-h">
    <div class="sec-head">
      <h2 class="sec-title" id="cats-h">Быстрые категории</h2>
      <a class="more" href="#catalog"><span>Смотреть все</span><svg aria-hidden="true"><use href="#i-next"/></svg></a>
    </div>
    <ul class="cats__grid" data-slot="cats"></ul>
  </section>

  <!-- 7. В каталоге: вкладки по реальным категориям, фото раздела в капсуле + лента товаров -->
  <section class="shop wrap" id="catalog" data-req="products" aria-labelledby="shop-h">
    <div class="sec-head sec-head--shop">
      <h2 class="sec-title" id="shop-h">В каталоге</h2>
      <div class="tabs" role="tablist" aria-label="Категории товаров" data-slot="tabs"></div>
      <div class="rail-nav">
        <button class="rail-nav__btn" type="button" data-rail="-1" aria-label="Предыдущие товары"><svg aria-hidden="true"><use href="#i-chev-l"/></svg></button>
        <button class="rail-nav__btn" type="button" data-rail="1" aria-label="Следующие товары"><svg aria-hidden="true"><use href="#i-chev-r"/></svg></button>
      </div>
    </div>
    <div class="shop__body">
      <a class="shop__photo" href="#" data-slot="shop-photo" aria-label="Для лица: смотреть все"></a>
      <div class="rail" id="rail" role="tabpanel" aria-labelledby="tab-0" tabindex="-1">
        <ul class="rail__track" data-slot="rail"></ul>
      </div>
    </div>
  </section>

  <!-- 8. Подборки: остальные плитки из данных -->
  <section class="picks wrap" aria-labelledby="picks-h">
    <div class="sec-head">
      <h2 class="sec-title" id="picks-h">Подборки</h2>
    </div>
    <ul class="picks__grid" data-slot="picks"></ul>
  </section>
</main>

<!-- 9. Подвал -->
<footer class="footer" data-req="footer">
  <div class="wrap footer__grid" data-slot="footer"></div>
</footer>

<!-- Нижняя панель телефона, как на сайте -->
<nav class="tabbar" aria-label="Быстрое меню">
  <a class="tabbar__item" href="#"><svg aria-hidden="true"><use href="#i-user"/></svg><span>Профиль</span></a>
  <a class="tabbar__item" href="#"><svg aria-hidden="true"><use href="#i-heart"/></svg><span>Избранное</span></a>
  <a class="tabbar__item tabbar__item--catalog" href="#catalog"><span class="tabbar__capsule"><svg aria-hidden="true"><use href="#i-menu"/></svg></span><span>Каталог</span></a>
  <a class="tabbar__item" href="#" data-cart-target aria-label="Корзина"><span class="tabbar__icon"><svg aria-hidden="true"><use href="#i-basket"/></svg><b class="badge badge--tab" data-cart-count hidden>0</b></span><span>Корзина</span></a>
  <button class="tabbar__item" type="button" data-search-focus aria-controls="q"><svg aria-hidden="true"><use href="#i-search"/></svg><span>Поиск</span></button>
</nav>

<p class="sr-only" aria-live="polite" id="live"></p>
